name: iraqi_national_id_reader
version: 1.0.0+1
description: >-
  A Flutter application for reading Iraqi national ID cards by scanning the MRZ and
  reading the embedded chip via NFC to display the citizen's identity information.
publish_to: "none"
environment:
  sdk: ">=2.19.0 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  mobile_scanner: ^3.5.7
  mrz_parser: ^2.1.0
  nfc_manager: ^3.5.0
  provider: ^6.0.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sample_mrz.txt
