name: readid_clone
description: تطبيق تجريبي يحاكي تجربة قراءة وثائق الهوية على غرار ReadID Me.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.10.5+2
  google_mlkit_text_recognition: ^0.11.0
  mrz_parser: ^2.0.0
  flutter_nfc_kit: ^3.5.2
  pointycastle: ^3.7.3
  path_provider: ^2.0.15
  path: ^1.8.3
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
